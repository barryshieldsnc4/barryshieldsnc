<!-- @dsCard group="Colors" viewport="700x170" subtitle="Paper, ink, and the two accents" name="Primary Palette" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;font-family:var(--font-sans);height:150px">
  <div style="flex:1;background:var(--paper);display:flex;align-items:flex-end;padding:10px;color:var(--ink-faint);font-size:12px">Paper<br>#F5F2EC</div>
  <div style="flex:1;background:var(--ink);display:flex;align-items:flex-end;padding:10px;color:var(--paper);font-size:12px">Ink<br>#1C1B19</div>
  <div style="flex:1;background:var(--accent);display:flex;align-items:flex-end;padding:10px;color:var(--paper);font-size:12px">Accent<br>#37493B</div>
  <div style="flex:1;background:var(--clay);display:flex;align-items:flex-end;padding:10px;color:var(--paper);font-size:12px">Clay<br>#A8542F</div>
  <div style="flex:1;background:var(--accent-soft);display:flex;align-items:flex-end;padding:10px;color:var(--ink);font-size:12px">Accent Soft<br>#DDE4D6</div>
</div>
