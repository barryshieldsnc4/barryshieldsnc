<!-- @dsCard group="Brand" viewport="700x170" subtitle="Hairline borders over shadows; radii stay small" name="Radius & Elevation" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:16px;padding:20px;background:var(--surface-page);height:130px;font-family:var(--font-sans);font-size:11px;color:var(--text-secondary)">
  <div style="flex:1;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center">border, radius-sm</div>
  <div style="flex:1;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center">shadow-sm</div>
  <div style="flex:1;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center">shadow-md</div>
  <div style="flex:1;background:var(--accent-soft);border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center">radius-pill</div>
</div>
