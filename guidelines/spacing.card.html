<!-- @dsCard group="Spacing" viewport="700x160" subtitle="4px base scale" name="Spacing Scale" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;align-items:flex-end;gap:10px;padding:20px;background:var(--surface-page);height:120px;font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)">
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:var(--space-1);height:var(--space-1);background:var(--accent)"></div>4</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:var(--space-2);height:var(--space-2);background:var(--accent)"></div>8</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:var(--space-3);height:var(--space-3);background:var(--accent)"></div>12</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:var(--space-4);height:var(--space-4);background:var(--accent)"></div>16</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:var(--space-5);height:var(--space-5);background:var(--accent)"></div>24</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:var(--space-6);height:var(--space-6);background:var(--accent)"></div>32</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:var(--space-7);height:var(--space-7);background:var(--accent)"></div>48</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:var(--space-8);height:var(--space-8);background:var(--accent)"></div>64</div>
</div>
