<!-- @dsCard group="Colors" viewport="700x170" subtitle="Text, surface, and border aliases" name="Semantic Tokens" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-mono);font-size:12px;background:var(--surface-page);padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:118px">
  <div style="color:var(--text-primary)">--text-primary</div>
  <div style="color:var(--text-secondary)">--text-secondary</div>
  <div style="color:var(--text-tertiary)">--text-tertiary</div>
  <div style="background:var(--surface-card);border:1px solid var(--border-default);padding:6px;color:var(--text-primary)">--surface-card</div>
  <div style="background:var(--surface-accent);padding:6px;color:var(--text-primary)">--surface-accent</div>
  <div style="background:var(--surface-highlight);padding:6px;color:var(--text-primary)">--surface-highlight</div>
</div>
